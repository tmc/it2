{{define "base"}}<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- iOS Safari fixes: prevent format detection that causes text scaling -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-touch-fullscreen" content="yes">
    <title>{{.Title}}</title>
    <!-- GitHub-style syntax highlighting CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
    {{template "styles" .}}
    {{template "head-scripts" .}}
</head>
<body>
    {{template "body-content" .}}
    {{template "scripts" .}}
</body>
</html>{{end}}

{{define "head-scripts"}}{{end}}

{{define "mathjax-scripts"}}
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script>
    window.MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
    };
</script>
{{end}}

{{define "mermaid-scripts"}}
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        mermaid.initialize({
            startOnLoad: false,
            theme: 'default',
            securityLevel: 'loose'
        });

        const mermaidBlocks = document.querySelectorAll('pre > code.language-mermaid');
        mermaidBlocks.forEach(async (block, index) => {
            const pre = block.parentElement;
            const graphDefinition = block.textContent;

            const div = document.createElement('div');
            div.className = 'mermaid';
            div.id = 'mermaid-' + index;

            try {
                const { svg } = await mermaid.render('mermaid-svg-' + index, graphDefinition);
                div.innerHTML = svg;
                pre.replaceWith(div);
            } catch (error) {
                console.error('Mermaid rendering error:', error);
            }
        });
    });
</script>
{{end}}
